<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskManager | TechSolutions</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="encabezado">
    <h1>TaskManager</h1>
    <p>Sistema web para la gestión de tareas de TechSolutions</p>
  </header>

  <main class="contenedor">
    <section class="tarjeta">
      <h2 id="titulo-formulario">Nueva tarea</h2>
      <form id="form-tarea" novalidate>
        <input type="hidden" id="tarea-id">
        <label for="nombre">Nombre de la tarea *</label>
        <input type="text" id="nombre" maxlength="120" placeholder="Ej. Elaborar documentación">

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" rows="3" placeholder="Detalle de la actividad"></textarea>

        <div class="fila">
          <div>
            <label for="prioridad">Prioridad</label>
            <select id="prioridad">
              {% for p in prioridades %}<option value="{{ p }}" {% if p == 'Media' %}selected{% endif %}>{{ p }}</option>{% endfor %}
            </select>
          </div>
          <div>
            <label for="estado">Estado</label>
            <select id="estado">
              {% for e in estados %}<option value="{{ e }}">{{ e }}</option>{% endfor %}
            </select>
          </div>
        </div>

        <div class="acciones">
          <button type="submit" id="btn-guardar" class="btn primario">Guardar tarea</button>
          <button type="button" id="btn-cancelar" class="btn" hidden>Cancelar edición</button>
        </div>
      </form>
      <div id="mensaje" class="mensaje" role="status" hidden></div>
    </section>

    <section class="tarjeta">
      <div class="cabecera-lista">
        <h2>Tareas registradas</h2>
        <div class="filtros">
          <select id="filtro-estado" aria-label="Filtrar por estado">
            <option value="">Todos los estados</option>
            {% for e in estados %}<option value="{{ e }}">{{ e }}</option>{% endfor %}
          </select>
          <select id="filtro-prioridad" aria-label="Filtrar por prioridad">
            <option value="">Todas las prioridades</option>
            {% for p in prioridades %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
          </select>
        </div>
      </div>
      <div class="resumen" id="resumen"></div>
      <table class="tabla">
        <thead>
          <tr><th>#</th><th>Tarea</th><th>Prioridad</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody id="lista-tareas"></tbody>
      </table>
      <p id="sin-tareas" class="vacio" hidden>No hay tareas registradas.</p>
    </section>
  </main>

  <footer class="pie">TaskManager v1.0.0 · Proyecto DevOps con GitHub</footer>
  <script>window.ESTADOS = {{ estados|list|tojson }};</script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
